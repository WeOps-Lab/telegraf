# WeOps / bk-lite slim Telegraf plugin selection config for custom_builder.
# Sourced from real collector templates + Telegraf.json defaults.
# Prefer breadth for bk-lite over absolute minimum.

[agent]
  interval = "10s"

# --- inputs from support-files + Telegraf.json + fusion-collector ---
[[inputs.bklite_script]]
[[inputs.bklite_rocketmq]]
[[inputs.activemq]]
[[inputs.apache]]
[[inputs.consul]]
[[inputs.cpu]]
[[inputs.disk]]
[[inputs.diskio]]
[[inputs.docker]]
[[inputs.elasticsearch]]
[[inputs.exec]]
[[inputs.file]]
  files = ["/dev/null"]
  data_format = "influx"
[[inputs.haproxy]]
[[inputs.http_listener_v2]]
  service_address = "tcp://:19090"
  data_format = "influx"
[[inputs.http_response]]
[[inputs.influxdb]]
[[inputs.internal]]
[[inputs.ipmi_sensor]]
[[inputs.mem]]
[[inputs.mongodb]]
[[inputs.mysql]]
[[inputs.sql]]
  driver = "mysql"
  dsn = "user:pass@tcp(127.0.0.1:3306)/"
[[inputs.nats_consumer]]
  servers = ["nats://127.0.0.1:4222"]
  subjects = ["metrics"]
  data_format = "influx"
[[inputs.net]]
[[inputs.net_response]]
[[inputs.netflow]]
[[inputs.nginx]]
[[inputs.nginx_vts]]
  urls = ["http://127.0.0.1/status"]
[[inputs.nvidia_smi]]
[[inputs.ping]]
[[inputs.postgresql]]
[[inputs.postgresql_extensible]]
  address = "host=127.0.0.1 user=postgres sslmode=disable"
[[inputs.processes]]
[[inputs.procstat]]
[[inputs.prometheus]]
[[inputs.rabbitmq]]
[[inputs.redis]]
[[inputs.sflow]]
[[inputs.snmp]]
[[inputs.sqlserver]]
[[inputs.system]]
[[inputs.tail]]
  files = ["/dev/null"]
  data_format = "influx"
[[inputs.tomcat]]
[[inputs.win_perf_counters]]
[[inputs.zookeeper]]

# --- outputs ---
[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"
[[outputs.influxdb]]
  urls = ["http://127.0.0.1:8086"]
[[outputs.kafka]]
  brokers = ["127.0.0.1:9092"]
  topic = "metrics"
  data_format = "influx"
[[outputs.nats]]
  servers = ["nats://127.0.0.1:4222"]
  subject = "metrics"
  data_format = "influx"
[[outputs.prometheus_client]]
  listen = ":9273"

# --- processors ---
[[processors.converter]]
[[processors.enum]]
[[processors.regex]]
[[processors.starlark]]
  source = "def apply(metric):\n  return metric\n"
